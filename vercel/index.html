<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinaCore | Consolidación</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
<style>body{margin:0;background:#181716}</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
mount({
  entrypoint: "app.py",
  files: { "app.py": { url: "./app.py.txt" } },
  archives: [{ url: "./bundle.zip", format: "zip" }],
  requirements: ["pandas", "openpyxl", "altair"],
  streamlitConfig: { "theme.base": "dark", "client.toolbarMode": "minimal" }
}, document.getElementById("root"));
</script>
</body>
</html>
